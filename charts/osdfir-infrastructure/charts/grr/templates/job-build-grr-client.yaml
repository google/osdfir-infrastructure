{{- $frontend := include "grr.clientBuilderAddress" . -}}
{{- $frontendPort := include "grr.clientBuilderPort" . -}}
{{- $builderHash := include "grr.clientBuilderHash" . -}}
{{- $clientBuilder := .Values.clientBuilder | default dict -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-grr-client-builder-%s" (.Release.Name | trunc 35 | trimSuffix "-") (trunc 8 $builderHash) }}
  labels:
    app.kubernetes.io/name: grr
    app.kubernetes.io/component: client-builder
  annotations:
    grr.osdfir.dev/client-builder-hash: {{ $builderHash | quote }}
spec:
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-grr-sa
      initContainers:
        - name: init-fleetspeak-health-check
          image: {{ .Values.initContainer.image }}
          command: ["/bin/sh", "-c"]
          args:
          - |
            set -e
            until [ "$(curl -s -w '%{http_code}' -o /dev/null http://{{ .Release.Name }}-grr-fleetspeak-frontend:{{ .Values.fleetspeak.frontend.healthCheckPort }})" -eq 200 ]
            do
              echo "Waiting for Fleetspeak Frontend to be ready";
              sleep 5;
            done
            echo "Fleetspeak Frontend health check is ready"
        - name: init-kaniko-env
          image: {{ .Values.initContainer.image }}
          command: ["/bin/sh", "-c"]
          args:
          - |
            set -e
            cp /sign/keys/*.pem /grr/exe/sign/keys/
            if [ -e /sign/keys/exe-sign.crt ]
            then
              echo "Extracting public key from certificate..."
              openssl x509 -in /sign/keys/exe-sign.crt -pubkey -noout > /grr/exe/sign/keys/exe-sign-public-key.pem
            fi
            {{ if not (get $clientBuilder "trustedCert") }}
            expected_fingerprint="$(openssl x509 -in /fleetspeak/tls.crt -noout -fingerprint -sha256)"
            until served_fingerprint="$(openssl s_client -connect "{{ $frontend }}:{{ $frontendPort }}" -servername "{{ $frontend }}" < /dev/null 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null)" \
              && [ "$served_fingerprint" = "$expected_fingerprint" ]
            do
              echo "Waiting for the external Fleetspeak endpoint to serve the current certificate"
              sleep 5
            done
            {{ end }}
            cp -LR /builder-context/. /kaniko-build/
            cp /grr/grr.server.yaml /kaniko-build/config/
          volumeMounts:
          - name: grr-exe-sign-keys-volume
            mountPath: /grr/exe/sign/keys
          - name: grr-exe-sign-keys-secret
            mountPath: /sign/keys
          - name: kaniko-volume
            mountPath: /kaniko-build
          - name: grr-client-builder-context
            mountPath: /builder-context
          - name: grr-server-config
            mountPath: /grr/grr.server.yaml
            subPath: server.local.yaml
          - name: fleetspeak-frontend-certificate
            mountPath: /fleetspeak/tls.crt
            subPath: tls.crt
      containers:
        - name: kaniko
          image: {{ .Values.initContainer.kanikoImage }}
          args:
            - "--dockerfile=Dockerfile.kaniko"
            - "--context=dir:///kaniko-build"
            - "--build-arg=FLEETSPEAK_FRONTEND={{ $frontend }}"
            - "--build-arg=FLEETSPEAK_FRONTEND_PORT={{ $frontendPort }}"
            - "--build-arg=FLEETSPEAK_TRUSTED_CERT_B64={{ get $clientBuilder "trustedCert" | default "" | b64enc }}"
            {{- if .Values.grr.daemon.image }}
            - "--destination={{ .Values.grr.daemon.image }}"
            {{- else }}
            - "--no-push"
            - "--no-push-cache"
            - "--destination=nowhere-to-push-the-image"
            {{- end }}
          volumeMounts:
          - name: grr-exe-sign-keys-volume
            mountPath: /grr/exe/sign/keys
          - name: kaniko-volume
            mountPath: /kaniko-build
          resources:
            requests:
              ephemeral-storage: 5Gi
      restartPolicy: Never
      volumes:
        - name: kaniko-volume
          emptyDir:
            sizeLimit: 25Mi
        - name: grr-client-builder-context
          configMap:
            name: {{ .Release.Name }}-grr-build-context
            items:
            - key: Dockerfile.kaniko
              path: Dockerfile.kaniko
            - key: grr-client-config.yaml
              path: grr-client-config.yaml
            - key: communicator.txt
              path: config/communicator.txt
            - key: config.textproto.tmpl
              path: config/config.textproto.tmpl
            - key: config.windows.textproto.tmpl
              path: config/config.windows.textproto.tmpl
            - key: grr.yaml
              path: config/grr.yaml
            - key: grr.service
              path: config/textservices/grr.service
        - name: grr-exe-sign-keys-volume
          emptyDir:
            sizeLimit: 5Mi
        - name: grr-exe-sign-keys-secret
          secret:
            secretName: {{ .Release.Name }}-grr-executable-signing-keys
        - name: grr-server-config
          secret:
            secretName: {{ .Release.Name }}-grr-server-local
            items:
            - key: server.local.yaml
              path: server.local.yaml
        - name: fleetspeak-frontend-certificate
          secret:
            secretName: {{ .Release.Name }}-grr-fleetspeak-frontend-components
            items:
            - key: tls.crt
              path: tls.crt
